plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.energy.checkin'
    compileSdk 34

    defaultConfig {
        applicationId "com.energy.checkin"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ViewModel / LiveData / lifecycleScope
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // 微信开放 SDK（移动应用登录）。版本以官方最新为准。
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android:6.8.0'

    // TODO(接云): 添加官方 CloudBase Android SDK，并对照其 API 调整 CloudBaseCheckinRepository。
    // 旧版坐标参考：com.tencent.tcb:cloudbase-android-sdk:1.0.0
    // 新版请以 CloudBase 控制台 / 文档给出的 Maven 坐标为准。
    // implementation 'com.cloudbase:cloudbase-android:latest'
}
